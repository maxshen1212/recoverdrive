# E3 closed loop in CARLA (scripts/run_e3.py). Uses the frozen E1/E2 config and overrides only what depends on
# the simulated sensors.
base: configs/eval.yaml
overrides:
  vlm:
    base_url: [http://127.0.0.1:8002/v1]  # a server of its own, so E3 does not compete with the E1/E2 runs
  data:
    cameras: [CAM_FRONT, CAM_BACK]
    nominal_lidar_points: 34000  # 32-beam ray-cast LiDAR at 400k points/s, 10 Hz (checked in the T12 smoke run)
